name: bump

# Polls the Land Survey plugin's latest release and moves both casks to it and
# to the host build it was pinned to, in one commit. Polling from the tap means
# the plugin repo needs no cross-repo token. A plugin release can still nudge it
# early with `gh workflow run bump.yml -R KevinGriffin-new/homebrew-opencad`.
#
# Scheduled workflows on this account have stalled for days before, so a failed
# run opens an issue rather than relying on someone noticing a red X.
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "plugin version (default: latest release)"
        required: false
  repository_dispatch:
    types: [plugin-released]

concurrency:
  group: bump
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  bump:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Bump casks
        id: bump
        run: |
          set +e
          python3 scripts/bump.py ${{ inputs.version || github.event.client_payload.version }}
          code=$?
          set -e
          if [ "$code" = "3" ]; then
            echo "::notice::waiting for the signed host build; nothing to do yet"
            exit 0
          fi
          exit "$code"

      - name: Check the casks agree
        run: python3 scripts/bump.py --check

      # Commit before auditing: `brew tap <path>` clones the repo, so it only
      # sees committed casks. Push only after the audit passes.
      - name: Commit locally
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "casks unchanged"
            exit 0
          fi
          v=$(sed -n 's/^  version "\(.*\)"/\1/p' Casks/opencad-landsurvey.rb)
          h=$(sed -n 's/^  version "\(.*\)"/\1/p' Casks/opencadstudio.rb)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "opencad-landsurvey $v, opencadstudio $h"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Audit
        if: steps.commit.outputs.changed == 'true'
        run: |
          set -euo pipefail
          brew tap kevingriffin-new/opencad "$GITHUB_WORKSPACE"
          brew trust --tap kevingriffin-new/opencad
          casks="kevingriffin-new/opencad/opencadstudio kevingriffin-new/opencad/opencad-landsurvey"
          brew style --cask $casks
          brew audit --cask --online $casks

      - name: Push
        if: steps.commit.outputs.changed == 'true'
        run: git push

      - name: Report failure
        if: failure()
        run: |
          set -euo pipefail
          TITLE="bump failing"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$TITLE in:title" --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "Still failing: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body "The cask bump failed: $RUN_URL. The casks were not changed."
          fi
